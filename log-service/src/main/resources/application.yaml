spring:
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      discovery:
        namespace: dev
        group: BLOG
      config:
        namespace: dev
        group: BLOG
  config:
    import:
      - optional:nacos:log.yaml?refreshEnabled=true
      - optional:nacos:sentinel.yaml
      - optional:nacos:rabbitmq.yaml?refreshEnabled=true
      - optional:nacos:log-service.yaml?refreshEnabled=true
